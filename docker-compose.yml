services:
  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      POSTGRES_DB: arctic_team
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: egor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - arctic-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d arctic_team" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: arctic_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@arctic.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - arctic-net

  backend:
    build: .
    container_name: backend-arctic
    ports:
      - "8080:8080"
    environment:
      SPRING_REDIS_HOST: redis-cache
      SPRING_REDIS_PORT: 6379
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "false"
      JWT_SECRET: ${JWT_SECRET}
      GIGACHAT_KEY: ${GIGACHAT_KEY:-key}
      ANALYTICS_PROVIDER: ${ANALYTICS_PROVIDER:-gigachat}
    networks:
      - arctic-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - with-python
      - without-python
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  python-service:
    build: ./python-service/api
    container_name: python-service
    environment:
      POSTGRES_DB: arctic_team
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: egor
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      AUTHORIZATION_KEY: 1234567
    profiles:
      - with-python
    ports:
      - "8000:8000"
    networks:
      - arctic-net
    depends_on:
      postgres:
        condition: service_healthy
      

  redis:
    image: redis:7-alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - arctic-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:

networks:
  arctic-net:
    driver: bridge
